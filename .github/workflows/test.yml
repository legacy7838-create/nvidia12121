name: NVIDIA Speed Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test NVIDIA API
        run: |
          curl -4 -s \
            -w '\n\n========== TIMING ==========\nDNS:        %{time_namelookup}s\nConnect:    %{time_connect}s\nTLS:        %{time_appconnect}s\nTTFB:       %{time_starttransfer}s\nTotal:      %{time_total}s\n============================\n' \
            https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer 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" \
            -d '{
              "model": "moonshotai/kimi-k3",
              "messages": [
                {
                  "role": "user",
                  "content": "Hello!"
                }
              ],
              "stream": false
            }'
